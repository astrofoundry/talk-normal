name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate tag matches version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match plugin version $VERSION"
            exit 1
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.231
      - name: Run checks
        run: node scripts/check.mjs

      - name: Package OpenAI plugin
        run: |
          zip -q "$RUNNER_TEMP/talk-normal-openai.zip" \
            .codex-plugin/plugin.json \
            skills/talk-normal/SKILL.md \
            skills/talk-normal/agents/openai.yaml \
            hooks/codex.json \
            hooks/codex-session-start.mjs \
            assets/talk-normal.jpg \
            LICENSE

      - name: Package skill for Claude upload
        run: |
          stage=$(mktemp -d "$RUNNER_TEMP/talk-normal-claude.XXXXXX")
          trap 'rm -rf "$stage"' EXIT
          mkdir "$stage/talk-normal"
          node --input-type=module - "$stage/talk-normal/SKILL.md" <<'NODE'
          import fs from 'node:fs';
          const skill = fs.readFileSync('skills/talk-normal/SKILL.md', 'utf8');
          const upload = skill.replace(/^---\r?\n[\s\S]*?\r?\n---/, frontmatter =>
            frontmatter.replace(/^disable-model-invocation: true\r?\n/m, ''));
          fs.writeFileSync(process.argv[2], upload);
          NODE
          cp LICENSE "$stage/talk-normal/LICENSE"
          cd "$stage"
          zip -q "$RUNNER_TEMP/talk-normal-skill.zip" talk-normal/SKILL.md talk-normal/LICENSE

      - name: Export complete instructions for copy and paste
        run: |
          node hooks/codex-session-start.mjs > "$RUNNER_TEMP/talk-normal-instructions.md"
          test -s "$RUNNER_TEMP/talk-normal-instructions.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            "$RUNNER_TEMP/talk-normal-openai.zip" \
            "$RUNNER_TEMP/talk-normal-skill.zip" \
            "$RUNNER_TEMP/talk-normal-instructions.md"
